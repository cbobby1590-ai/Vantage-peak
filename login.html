
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Gateway | Vantage Peake Bank</title>
    <link rel="stylesheet" href="base.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html" style="color: inherit; text-decoration: none;">Vantage<span>Peake</span></a></div>
    </nav>

    <main class="form-wrapper">
        <h2 style="margin-bottom: 0.5rem; color: var(--primary-navy);">Client Portal</h2>
        <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem;">Input validated access routing credentials to initialize your secure session.</p>
        
        <!-- Error message slot -->
        <div id="error-message" style="display: none; background-color: #FEE2E2; color: #DC2626; padding: 0.75rem; border-radius: 4px; font-size: 0.85rem; margin-bottom: 1.25rem; font-weight: 500; border: 1px solid #FCA5A5;"></div>

        <form id="loginForm" onsubmit="return validateCredentials(event)">
            <div class="form-group">
                <label for="username">Access ID / Username</label>
                <input type="text" id="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Passcode / Cryptographic Key</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-submit">Secure Session Initializer</button>
        </form>
    </main>

    <!-- Hardcoded Gatekeeping Script -->
    <script>
        function validateCredentials(event) {
            // Prevent the form from submitting automatically
            event.preventDefault();

            // Retrieve form field values
            const userInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorBox = document.getElementById('error-message');

            // Explicit target credentials validation match
            if (userInput === "sophia349" && passwordInput === "94566") {
                errorBox.style.display = "none";
                // Route user seamlessly to the workspace file if validated
                window.location.href = "dashboard.html";
            } else {
                // Trigger warning block and wipe clear password array field
                errorBox.innerText = "AUTHENTICATION FAILURE: Invalid cryptographic passcode match or unexpected user route registry key.";
                errorBox.style.display = "block";
                document.getElementById('password').value = "";
            }
            return false;
        }
    </script>

</body>
</html>
