<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Vantage Peake Bank</title>
    <style>
        /* Base Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px; /* Space for the bottom navbar */
        }

        /* Top Portal Header */
        header {
            background-color: #0c2340;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
        }

        .user-profile h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .user-profile p {
            color: #d4af37;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .system-status {
            text-align: right;
        }

        .status-badge {
            background-color: #2e7d32;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 4px;
        }

        .system-status p {
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* Core Workspace Layout */
        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Balance Grid (Cards) */
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .account-card {
            background: linear-gradient(135deg, #0c2340 0%, #1a3a60 100%);
            color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid #d4af37;
        }

        .account-card::before {
            content: '';
            position: absolute;
            right: -30px;
            bottom: -30px;
            width: 150px;
            height: 150px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 50%;
        }

        .account-card h3 {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .account-balance {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .account-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .account-meta span {
            color: #ffffff;
            font-family: monospace;
        }

        /* Quick Portal Actions */
        .actions-panel {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: #f1f5f9;
            color: #0c2340;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .action-btn:hover {
            background-color: #d4af37;
            color: #0c2340;
        }

        .action-btn.primary {
            background-color: #0c2340;
            color: #ffffff;
        }

        .action-btn.primary:hover {
            background-color: #d4af37;
            color: #0c2340;
        }

        /* Ledger Transactions Table Container */
        .ledger-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 25px;
            overflow-hidden;
        }

        .ledger-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .ledger-header h2 {
            color: #0c2340;
            font-size: 1.3rem;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            padding: 14px 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        /* Credit vs Debit Coloring labels */
        .amt-credit {
            color: #16a34a;
            font-weight: 600;
        }

        .amt-debit {
            color: #dc2626;
            font-weight: 600;
        }

        .tx-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tx-wire { background-color: #e0f2fe; color: #0369a1; }
        .tx-pos { background-color: #f1f5f9; color: #475569; }
        .tx-ach { background-color: #f0fdf4; color: #166534; }
        .tx-atm { background-color: #fef2f2; color: #991b1b; }

        /* Fixed Bottom Navigation Configuration */
        footer {
            background-color: #0c2340;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.15);
            z-index: 9999;
        }

        .navigation-menu {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 10px;
            list-style: none;
        }

        .navigation-menu li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 18px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .navigation-menu li a:hover, 
        .navigation-menu li a.active {
            background-color: #d4af37;
            color: #0c2340;
        }

        .navigation-menu li .logout-btn {
            background-color: #7f1d1d;
            color: #ffffff;
        }

        .navigation-menu li .logout-btn:hover {
            background-color: #dc2626;
            color: #ffffff;
        }

        /* Screen Adjustment Rules */
        @media (max-width: 768px) {
            body {
                padding-bottom: 140px;
            }
            header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            .system-status {
                text-align: center;
            }
            .navigation-menu {
                flex-wrap: wrap;
                gap: 8px;
                padding: 12px 5px;
            }
            .navigation-menu li a {
                font-size: 0.85rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>
