<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Fund Transit Channel | Vantage Peake Bank</title>
    <link rel="stylesheet" href="base.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo">Vantage<span>Peake</span></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">Overview Ledger</a></li>
                <li><a href="transfer.html" class="active">Fund Transits</a></li>
                <li><a href="#">Card Matrix</a></li>
                <li><a href="#">Document Records</a></li>
                <li><a href="#">Security Profiles</a></li>
                <li><a href="index.html" style="margin-top: 3rem; color: #EF4444;">Terminate Session</a></li>
            </ul>
        </aside>

        <main class="dashboard-content">
            <h2>Initialize Assets Transit Form</h2>
            <p style="color: var(--text-light); margin-bottom: 2rem;">Safely dispatch balances across domestic clearing clearinghouses or immediate internal registers.</p>

            <div style="background-color: var(--white); padding: 2.5rem; border-radius: 8px; border: 1px solid var(--border-color); max-width: 600px;">
                <form action="dashboard.html" method="GET">
                    <div class="form-group">
                        <label for="source-account">Origin Assets Pool</label>
                        <select id="source-account" class="form-control">
                            <option>Liquid Checking Ledger (****5678) - $14,245.82</option>
                            <option>High-Yield Yield Hold (****1234) - $85,119.04</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="routing">Destination Interbank Routing Code</label>
                        <input type="text" id="routing" class="form-control" placeholder="9-digit system identifier" required>
                    </div>
                    <div class="form-group">
                        <label for="account-num">Target Registration Account Number</label>
                        <input type="text" id="account-num" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Execution Allocation Volume (USD)</label>
                        <input type="number" id="amount" class="form-control" placeholder="0.00" step="0.01" min="1" required>
                    </div>
                    <button type="submit" class="btn-submit" style="background-color: var(--accent-emerald);">Authorize Wire Dispatched Transmission</button>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
