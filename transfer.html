<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Funds</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; color: #f8fafc; }
        .dashboard-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        .main-content { flex: 1; padding: 24px; overflow-y: auto; padding-bottom: 100px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { text-decoration: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.85rem; font-weight: 500; }
        .nav-item:hover, .nav-item.active { color: #38bdf8; }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .header { margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 1rem; }
        .btn { width: 100%; padding: 14px; background-color: #38bdf8; border: none; border-radius: 8px; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <main class="main-content">
            <header class="header"><h1>Transfer Funds</h1></header>
            <div style="background-color: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                <div class="form-group">
                    <label>Recipient Name / Account</label>
                    <input type="text" placeholder="Enter name or account number">
                </div>
                <div class="form-group">
                    <label>Bank / Destination</label>
                    <select><option>Select Bank</option><option>Main Wallet</option></select>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" placeholder="0.00">
                </div>
                <button class="btn">Send Money</button>
            </div>
        </main>
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span>Home</span></a>
            <a href="transfer.html" class="nav-item active"><span class="nav-icon">💸</span><span>Transfer</span></a>
            <a href="reward.html" class="nav-item"><span class="nav-icon">🎁</span><span>Rewards</span></a>
            <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Settings</span></a>
        </nav>
    </div>
</body>
</html>
